services:
  - type: web
    name: strata-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && mkdir -p strata11/build strata11/data && cmake -S strata11 -B strata11/build && cmake --build strata11/build --config Release
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STRATA_MEMORY_DB
        value: data/strata.db
      - key: CORS_ORIGINS
        value: '*'
