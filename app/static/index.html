<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo">⚡</div>
            <h1>Strata</h1>
          </div>
          <div class="model-selector">
            <label for="modelSelect">Model</label>
            <select id="modelSelect" class="model-dropdown">
              <option value="default">Default</option>
              <option value="creative">Creative</option>
              <option value="analytical">Analytical</option>
              <option value="coding">Coding</option>
            </select>
          </div>
        </div>
      </header>

      <main class="chat-container">
        <div id="messages" class="messages"></div>
      </main>

      <div class="input-container">
        <div class="input-wrapper">
          <input id="messageInput" class="message-input" type="text" placeholder="Ask Strata anything..." autocomplete="off" />
          <button id="sendButton" class="send-button" type="button">➤</button>
        </div>
        <p class="footer-text">Strata can make mistakes. Always verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
