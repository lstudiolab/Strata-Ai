<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f8" />
    <title>Strata AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo" aria-hidden="true"></div>
            <h1>Strata</h1>
          </div>

          <div class="model-selector">
            <label for="modelSelect">Model</label>
            <select id="modelSelect" class="model-dropdown" aria-label="Choose model">
              <option value="strata" selected>Strata 1.0</option>
              <option value="saber">Saber 1.0</option>
              <option value="zen">Zen 1.0</option>
              <option value="marcus">Marcus 1.0</option>
            </select>
          </div>
        </div>
      </header>

      <main class="chat-container" aria-label="Strata conversation">
        <div id="messages" class="messages" aria-live="polite"></div>
      </main>

      <div class="input-container">
        <form class="input-wrapper" id="chatForm">
          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Message Strata"
            autocomplete="off"
            aria-label="Message Strata"
          />
          <button id="sendButton" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="footer-text">Strata can make mistakes. Verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
