<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <div class="header">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo">⚡</div>
            <h1>Strata AI</h1>
          </div>
          <p class="subtitle">Your intelligent AI assistant</p>
        </div>
      </div>

      <!-- Chat Container -->
      <div class="chat-container">
        <div id="messages" class="messages"></div>
      </div>

      <!-- Input Area -->
      <div class="input-container">
        <div class="input-wrapper">
          <input
            id="messageInput"
            type="text"
            class="message-input"
            placeholder="Ask Strata anything..."
            autocomplete="off"
          />
          <button id="sendButton" class="send-button" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="footer-text">Strata can make mistakes. Please verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
