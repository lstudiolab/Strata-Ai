<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Strata AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <h1>Strata</h1>
        </div>
      </header>

      <main class="chat-container" aria-label="Strata conversation">
        <div id="messages" class="messages" aria-live="polite"></div>
      </main>

      <div class="input-container">
        <div id="contextPanel" class="context-panel" hidden>
          <textarea id="contextInput" class="context-input" placeholder="Add text for Strata to use..."></textarea>
          <button id="contextClose" class="context-close" type="button">Done</button>
        </div>

        <form class="input-wrapper" id="chatForm">
          <button id="contextButton" class="context-button" type="button" aria-label="Add text">+</button>
          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Message Strata"
            autocomplete="off"
            aria-label="Message Strata"
          />
          <button id="sendButton" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="footer-text">Strata can make mistakes. Verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
