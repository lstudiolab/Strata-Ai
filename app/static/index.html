<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Strata</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <h1>Strata</h1>
          <button id="settingsButton" class="glass-icon-button" type="button" aria-label="AI settings">•••</button>
        </div>
      </header>

      <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="settingsClose" class="drawer-close" type="button" aria-label="Close">×</button>
        </div>
        <div class="setting-row">
          <span>Memory</span>
          <span>Automatic</span>
        </div>
        <p class="settings-note">There is no fixed conversation limit. Strata automatically compacts older context when needed while keeping the full conversation history.</p>
        <div class="settings-section">
          <div class="settings-section-title">Conversations</div>
          <button id="newConversationButton" class="new-conversation-button" type="button">New conversation</button>
          <div id="conversationList" class="conversation-list settings-conversation-list"></div>
        </div>
      </aside>

      <main class="chat-container" aria-label="Strata conversation">
        <div id="messages" class="messages" aria-live="polite"></div>
      </main>

      <div class="input-container">
        <form class="input-wrapper" id="chatForm">
          <button id="attachmentButton" class="context-button" type="button" aria-label="Add a photo or file">+</button>
          <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Message Strata"
            autocomplete="off"
            aria-label="Message Strata"
          />
          <button id="sendButton" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <div id="attachmentPreview" class="attachment-preview" hidden></div>
        <p class="footer-text">Strata can make mistakes. Verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
