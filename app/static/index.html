<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Strata AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <div class="header-content">
          <button id="historyButton" class="history-button" type="button" aria-label="Past conversations" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <h1>Strata</h1>
          <span class="header-spacer" aria-hidden="true"></span>
        </div>
      </header>

      <aside id="conversationDrawer" class="conversation-drawer" aria-hidden="true">
        <div class="drawer-header">
          <div>
            <h2>Conversations</h2>
            <p>Past conversations</p>
          </div>
          <button id="historyClose" class="history-close" type="button" aria-label="Close conversations">×</button>
        </div>
        <button id="newConversationButton" class="new-conversation-button" type="button">New conversation</button>
        <div id="conversationList" class="conversation-list"></div>
      </aside>
      <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

      <main class="chat-container" aria-label="Strata conversation">
        <div id="messages" class="messages" aria-live="polite"></div>
      </main>

      <div class="input-container">
        <div id="contextPanel" class="context-panel" hidden>
          <textarea id="contextInput" class="context-input" placeholder="Add text for Strata to use..."></textarea>
          <button id="contextClose" class="context-close" type="button">Done</button>
        </div>

        <form class="input-wrapper" id="chatForm">
          <button id="contextButton" class="context-button" type="button" aria-label="Add text">+</button>
          <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Message Strata"
            autocomplete="off"
            aria-label="Message Strata"
          />
          <button id="sendButton" class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="footer-text">Strata can make mistakes. Verify important information.</p>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
